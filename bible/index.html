<!doctype html>
<html lang="zh-Hant" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ZZ聖經經文閱讀，提供繁體中文和合本聖經線上閱讀，可依新約、舊約、書卷及章節快速查閱聖經經文。">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#213f34">
    <link rel="canonical" href="https://liaozihzrong.github.io/bible/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:site_name" content="ZZ聖經經文閱讀">
    <meta property="og:title" content="ZZ聖經經文閱讀｜和合本聖經線上閱讀">
    <meta property="og:description" content="ZZ聖經經文閱讀提供繁體中文和合本聖經線上閱讀，可依新舊約、書卷及章節快速查閱經文。">
    <meta property="og:url" content="https://liaozihzrong.github.io/bible/">
    <meta name="twitter:card" content="summary">
    <title>ZZ聖經經文閱讀｜和合本聖經線上閱讀</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ZZ聖經經文閱讀",
        "alternateName": "ZZ聖經經文閱讀｜和合本聖經線上閱讀",
        "url": "https://liaozihzrong.github.io/bible/",
        "inLanguage": "zh-Hant",
        "description": "ZZ聖經經文閱讀提供繁體中文和合本聖經線上閱讀，可依新舊約、書卷及章節快速查閱聖經經文。"
      }
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="styles.css?v=8">
  </head>
  <body>
    <aside id="side-toolbar" class="side-toolbar" aria-label="操作工具列">
      <button id="fullscreen-button" class="tool-button" type="button" aria-pressed="false" aria-label="進入全螢幕" title="全螢幕">
        <svg class="icon-enter-fullscreen" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
        </svg>
        <svg class="icon-exit-fullscreen" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" />
        </svg>
      </button>
      <ol id="quick-tabs" class="quick-tabs" aria-label="快捷分頁"></ol>
      <button id="quick-tab-remove" class="tool-button" type="button" aria-pressed="false" aria-label="移除快捷分頁" title="移除快捷分頁" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" /></svg>
      </button>
    </aside>
    <div id="toolbar-toast" class="toolbar-toast" role="status" aria-live="polite"></div>

    <header class="site-header">
      <div class="container py-4 py-md-5 text-center">
        <p class="eyebrow mb-2">Chinese Union Version</p>
        <h1 class="display-5 mb-2"><span class="brand-prefix">ZZ</span>聖經經文閱讀</h1>
        <p class="translation-name h3 mb-2">和合本聖經</p>
        <div class="header-actions mt-3">
          <a class="btn btn-outline-light rounded-pill px-4" href="guide.html">經文 API 使用說明（可直接給 AI 讀取校正經文）</a>
          <button id="font-size-decrease" class="btn btn-outline-light rounded-pill px-4" type="button">
            縮小文字
          </button>
          <button id="font-size-button" class="btn btn-outline-light rounded-pill px-4" type="button">
            放大文字
          </button>
          <span id="font-size-status" class="visually-hidden" aria-live="polite"></span>
        </div>
      </div>
    </header>

    <main class="container reading-container py-4 py-lg-5">
      <section id="selector-card" class="selector-card card border-0 shadow-sm mb-4" aria-labelledby="selector-title">
        <div id="selector-body" class="card-body">
          <h2 id="selector-title" class="visually-hidden">選擇經文</h2>
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label for="testament-select" class="form-label">新舊約</label>
              <select id="testament-select" class="form-select form-select-lg" disabled>
                <option value="Old_Testament">舊約</option>
                <option value="New_Testament">新約</option>
              </select>
            </div>
            <div class="col-12 col-md-4">
              <label for="book-select" class="form-label">書卷</label>
              <select id="book-select" class="form-select form-select-lg" disabled></select>
            </div>
            <div class="col-12 col-md-4">
              <label for="chapter-select" class="form-label">章</label>
              <select id="chapter-select" class="form-select form-select-lg" disabled></select>
            </div>
          </div>
        </div>
        <button id="selector-toggle" class="selector-toggle" type="button" aria-controls="selector-body" aria-expanded="true" aria-label="縮起經文選擇">縮起</button>
      </section>

      <div id="status" class="status-panel text-center py-5" role="status" aria-live="polite">
        <div class="spinner-border" aria-hidden="true"></div>
        <p class="mt-3 mb-0">正在載入經文目錄⋯⋯</p>
      </div>

      <article id="reading" class="scripture-card card border-0 shadow-sm d-none" aria-labelledby="chapter-title">
        <div class="card-body px-1 py-3 px-sm-3 py-sm-4 py-lg-5">
          <header class="chapter-header text-center mb-4 pb-3">
            <span id="testament-badge" class="badge rounded-pill mb-3"></span>
            <h2 id="chapter-title" class="display-6 mb-2"></h2>
            <p id="chapter-meta" class="text-secondary mb-0"></p>
          </header>
          <div id="verses" class="verses"></div>
        </div>
      </article>

      <nav id="chapter-navigation" class="chapter-navigation d-none mt-4" aria-label="章節導覽">
        <button id="previous-button" type="button" class="btn btn-outline-primary btn-lg">
          <span aria-hidden="true">←</span> 上一章
        </button>
        <button id="next-button" type="button" class="btn btn-primary btn-lg">
          下一章 <span aria-hidden="true">→</span>
        </button>
      </nav>

      <noscript>
        <div class="alert alert-warning mt-4">此閱讀器需要啟用 JavaScript 才能載入經文。</div>
      </noscript>
    </main>

    <footer class="site-footer mt-auto">
      <div class="container py-4 text-center">
        <p class="mb-1">繁體中文和合本聖經閱讀</p>
        <p class="small mb-0">
          經文資料來源：
          <a href="https://springbible.fhl.net/Bible2/cgic201/read100.html" target="_blank" rel="noopener noreferrer">信望愛聖經閱讀系統</a>
          <span aria-hidden="true">・</span>
          <a href="guide.html">經文資料使用說明</a>
        </p>
        <p class="small mt-2 mb-0"><a href="../">ZZ的程式筆記</a></p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="font-size.js?v=3"></script>
    <script src="app.js?v=6"></script>
  </body>
</html>
